# ===================================================================
# Spring Boot Configuration - Cloud Vehicle Rental Management System
# ===================================================================
server.port=8080
server.servlet.context-path=/api

# ----------------- LOCAL MYSQL DATABASE CONFIGURATION -------------
# Update username & password if using custom MySQL / XAMPP setup
spring.datasource.url=jdbc:mysql://localhost:3306/vehiclerental_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------- AWS RDS PRODUCTION CONFIGURATION (OVERRIDE) -----
# For AWS EC2 production, set these environment variables or update:
# spring.datasource.url=jdbc:mysql://${RDS_HOSTNAME:localhost}:${RDS_PORT:3306}/${RDS_DB_NAME:vehiclerental_db}?useSSL=true&requireSSL=false
# spring.datasource.username=${RDS_USERNAME:admin}
# spring.datasource.password=${RDS_PASSWORD}

# ----------------- JPA & HIBERNATE SETTINGS -----------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ----------------- SECURITY & JWT CONFIGURATION -------------------
app.jwt.secret=9a4f2c8d3e7b1a5f6e8c0d2b4a6f8e1d3c5b7a9e2f4a6b8c0d1e3f5a7b9c1d3e
app.jwt.expiration-ms=86400000

# ----------------- LOGGING CONFIGURATION --------------------------
logging.level.com.example.vehiclerental=INFO
logging.level.org.springframework.security=WARN
